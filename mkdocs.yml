theme:
  name: material
  custom_dir: docs/docs_overrides
  font:
    text: Inter
    code: Roboto Mono
  # logo: images/logos/ndp-logo.png
  logo: images/logos/wstc-logo.png
  favicon: images/logos/wstc-logo.png
  features:
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    # - navigation.indexes
    - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - scheme: ndp-light
      # primary: ndp-light
      # accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
# repo_url: https://github.com/national-data-platform

# Plugins
# plugins:
#   - search:
#       separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # - minify:
  #     minify_html: true

extra:
  homepage: https://www.wildfirecommons.org/
  social:
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/wildfirecommons.bsky.social
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/groups/14463867/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg